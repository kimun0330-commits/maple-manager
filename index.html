<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMS Character & Equipment Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-10">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold flex items-center justify-center">
        <i data-lucide="shield"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide text-amber-400">GMS Spec Tracker</h1>
        <p class="text-xs text-slate-400">Global MapleStory Character & Equipment Manager</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button onclick="exportData()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 transition">
        <i data-lucide="download" class="w-4 h-4"></i> JSON 내보내기
      </button>
      <label class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 cursor-pointer transition">
        <i data-lucide="upload" class="w-4 h-4"></i> JSON 불러오기
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
      </label>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar: Character List -->
    <aside class="w-80 bg-slate-900/50 border-r border-slate-800 flex flex-col p-4 gap-4">
      
      <!-- Add Character Search Box -->
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
        <label class="text-xs font-semibold text-slate-400 block mb-2">GMS 캐릭터 검색 / 추가</label>
        <div class="flex gap-2">
          <input type="text" id="ignInput" placeholder="Character IGN" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:border-amber-500 text-slate-100">
          <button onclick="fetchAndAddCharacter()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-2 rounded-lg font-semibold text-sm flex items-center justify-center transition">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Character Cards List -->
      <div class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2" id="charList">
        <!-- Rendered via JS -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 bg-slate-950 flex flex-col overflow-hidden">
      
      <!-- Character Profile Banner -->
      <div id="profileBanner" class="bg-slate-900/80 border-b border-slate-800 p-6 flex justify-between items-center">
        <!-- Rendered via JS -->
      </div>

      <!-- Equipment & Specs Content -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
        <div class="max-w-6xl mx-auto">
          <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <i data-lucide="sword" class="text-amber-400"></i> 착용 장비 및 스펙 입력
          </h2>

          <!-- Equipment Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="equipmentGrid">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </main>

  </div>

  <script>
    // Initial State
    let characters = JSON.parse(localStorage.getItem('gms_tracker_chars')) || [
      {
        id: '1',
        ign: 'GMS_Hero',
        level: 280,
        job: 'Hero',
        server: 'Heroic (Hyperion)',
        guild: 'Maple',
        avatar: 'https://maplestory.io/api/GMS/280/mob/8880000/render/stand',
        equipment: {}
      }
    ];
    let selectedCharId = characters[0]?.id || null;

    const slotList = [
      { id: 'weapon', name: '무기 (Weapon)', type: 'wse' },
      { id: 'subweapon', name: '보조무기 (Sub-weapon)', type: 'wse' },
      { id: 'emblem', name: '엠블렘 (Emblem)', type: 'wse' },
      { id: 'hat', name: '모자 (Hat)', type: 'armor' },
      { id: 'top', name: '상의 (Top)', type: 'armor' },
      { id: 'bottom', name: '하의 (Bottom)', type: 'armor' },
      { id: 'shoes', name: '신발 (Shoes)', type: 'armor' },
      { id: 'gloves', name: '장갑 (Gloves)', type: 'armor' },
      { id: 'cape', name: '망토 (Cape)', type: 'armor' },
      { id: 'shoulder', name: '어깨장식 (Shoulder)', type: 'armor' },
      { id: 'gollux_ring1', name: '골럭스 반지 1 (Superior)', type: 'acc' },
      { id: 'gollux_ring2', name: '골럭스 반지 2 (Reinforced)', type: 'acc' },
      { id: 'ring3', name: '반지 3 (Event/Seed)', type: 'acc' },
      { id: 'ring4', name: '반지 4 (Conti/RoR)', type: 'acc' },
      { id: 'gollux_pendant1', name: '골럭스 목걸이 1', type: 'acc' },
      { id: 'gollux_pendant2', name: '골럭스 목걸이 2', type: 'acc' },
      { id: 'gollux_belt', name: '골럭스 벨트', type: 'acc' },
      { id: 'gollux_earring', name: '골럭스 귀고리', type: 'acc' },
      { id: 'face', name: '얼굴장식 (Face)', type: 'acc' },
      { id: 'eye', name: '눈장식 (Eye)', type: 'acc' },
      { id: 'badge', name: '뱃지 (Badge)', type: 'acc' },
      { id: 'heart', name: '안드로이드 하트 (Heart)', type: 'acc' },
      { id: 'familiar1', name: '파밀리어 1 (Familiar 1)', type: 'fam' },
      { id: 'familiar2', name: '파밀리어 2 (Familiar 2)', type: 'fam' },
      { id: 'familiar3', name: '파밀리어 3 (Familiar 3)', type: 'fam' }
    ];

    function saveData() {
      localStorage.setItem('gms_tracker_chars', JSON.stringify(characters));
    }

    function renderCharList() {
      const container = document.getElementById('charList');
      container.innerHTML = characters.map(c => `
        <div onclick="selectChar('${c.id}')" class="p-3 rounded-xl border transition cursor-pointer flex items-center justify-between ${c.id === selectedCharId ? 'bg-slate-800 border-amber-500/50 text-white' : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:bg-slate-800/50'}">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-slate-950 flex items-center justify-center border border-slate-800 overflow-hidden">
              <img src="${c.avatar}" class="w-8 h-8 object-contain" onerror="this.src='https://maplestory.io/api/GMS/280/mob/8880000/render/stand'">
            </div>
            <div>
              <div class="font-bold text-sm text-slate-100">${c.ign}</div>
              <div class="text-xs text-slate-400">Lv.${c.level} · ${c.job}</div>
            </div>
          </div>
          <button onclick="deleteChar(event, '${c.id}')" class="text-slate-500 hover:text-rose-400 p-1 rounded transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderProfile() {
      const banner = document.getElementById('profileBanner');
      const c = characters.find(item => item.id === selectedCharId);
      if (!c) {
        banner.innerHTML = `<div class="text-slate-400">선택된 캐릭터가 없습니다.</div>`;
        return;
      }

      banner.innerHTML = `
        <div class="flex items-center gap-5">
          <div class="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-700 flex items-center justify-center overflow-hidden">
            <img src="${c.avatar}" class="w-12 h-12 object-contain" onerror="this.src='https://maplestory.io/api/GMS/280/mob/8880000/render/stand'">
          </div>
          <div>
            <div class="flex items-center gap-3">
              <h2 class="text-2xl font-bold text-slate-100">${c.ign}</h2>
              <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2.5 py-1 rounded-full font-medium">${c.server}</span>
            </div>
            <p class="text-sm text-slate-400 mt-1">Level ${c.level} · ${c.job} ${c.guild ? '· Guild: ' + c.guild : ''}</p>
          </div>
        </div>
      `;
    }

    function renderEquipment() {
      const grid = document.getElementById('equipmentGrid');
      const currentChar = characters.find(c => c.id === selectedCharId);
      if (!currentChar) {
        grid.innerHTML = '';
        return;
      }

      const eqData = currentChar.equipment || {};

      grid.innerHTML = slotList.map(slot => {
        const item = eqData[slot.id] || { starforce: 0, mainPotGrade: 'Rare', mainPotText: '', addPotGrade: 'Rare', addPotText: '' };
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 hover:border-slate-700 transition">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <span class="font-bold text-sm text-amber-400 flex items-center gap-1.5">
                <i data-lucide="shield" class="w-3.5 h-3.5"></i> ${slot.name}
              </span>
              <span class="text-xs font-semibold text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                ★ ${item.starforce || 0}
              </span>
            </div>

            <!-- Starforce Slider -->
            <div>
              <label class="text-xs text-slate-400 justify-between flex mb-1">
                <span>스타포스 강화 수치</span>
                <span class="font-bold text-slate-200">${item.starforce || 0} 성</span>
              </label>
              <input type="range" min="0" max="30" value="${item.starforce || 0}" 
                onchange="updateItem('${slot.id}', 'starforce', parseInt(this.value))"
                class="w-full accent-amber-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer">
            </div>

            <!-- Main Potential -->
            <div class="space-y-1">
              <label class="text-xs text-slate-400 block">메인 잠재능력 (Main Potential)</label>
              <div class="flex gap-2">
                <select onchange="updateItem('${slot.id}', 'mainPotGrade', this.value)" class="bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 text-slate-200 focus:outline-none">
                  <option value="Rare" ${item.mainPotGrade === 'Rare' ? 'selected' : ''}>Rare</option>
                  <option value="Epic" ${item.mainPotGrade === 'Epic' ? 'selected' : ''}>Epic</option>
                  <option value="Unique" ${item.mainPotGrade === 'Unique' ? 'selected' : ''}>Unique</option>
                  <option value="Legendary" ${item.mainPotGrade === 'Legendary' ? 'selected' : ''}>Legendary</option>
                </select>
                <input type="text" value="${item.mainPotText || ''}" placeholder="예: 보공 35% / 공 9% / 공 9%" 
                  onchange="updateItem('${slot.id}', 'mainPotText', this.value)"
                  class="bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 flex-1 text-slate-200 focus:outline-none">
              </div>
            </div>

            <!-- Additional Potential -->
            <div class="space-y-1">
              <label class="text-xs text-slate-400 block">에디셔널 잠재능력 (Additional Potential)</label>
              <div class="flex gap-2">
                <select onchange="updateItem('${slot.id}', 'addPotGrade', this.value)" class="bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 text-slate-200 focus:outline-none">
                  <option value="Rare" ${item.addPotGrade === 'Rare' ? 'selected' : ''}>Rare</option>
                  <option value="Epic" ${item.addPotGrade === 'Epic' ? 'selected' : ''}>Epic</option>
                  <option value="Unique" ${item.addPotGrade === 'Unique' ? 'selected' : ''}>Unique</option>
                  <option value="Legendary" ${item.addPotGrade === 'Legendary' ? 'selected' : ''}>Legendary</option>
                </select>
                <input type="text" value="${item.addPotText || ''}" placeholder="예: 공 12% / 주스탯 6%" 
                  onchange="updateItem('${slot.id}', 'addPotText', this.value)"
                  class="bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 flex-1 text-slate-200 focus:outline-none">
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function selectChar(id) {
      selectedCharId = id;
      renderCharList();
      renderProfile();
      renderEquipment();
    }

    function fetchAndAddCharacter() {
      const input = document.getElementById('ignInput');
      const ign = input.value.trim();
      if (!ign) return;

      const newChar = {
        id: Date.now().toString(),
        ign: ign,
        level: 260,
        job: 'Explorer',
        server: 'Heroic (Hyperion)',
        guild: 'GMS Guild',
        avatar: 'https://maplestory.io/api/GMS/280/mob/8880000/render/stand',
        equipment: {}
      };

      characters.push(newChar);
      saveData();
      input.value = '';
      selectChar(newChar.id);
    }

    function updateItem(slotId, field, value) {
      const char = characters.find(c => c.id === selectedCharId);
      if (!char) return;

      if (!char.equipment) char.equipment = {};
      if (!char.equipment[slotId]) {
        char.equipment[slotId] = { starforce: 0, mainPotGrade: 'Rare', mainPotText: '', addPotGrade: 'Rare', addPotText: '' };
      }

      char.equipment[slotId][field] = value;
      saveData();
    }

    function deleteChar(e, id) {
      e.stopPropagation();
      characters = characters.filter(c => c.id !== id);
      if (selectedCharId === id) {
        selectedCharId = characters[0]?.id || null;
      }
      saveData();
      renderCharList();
      renderProfile();
      renderEquipment();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(characters, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "gms_spec_tracker_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            characters = imported;
            selectedCharId = characters[0]?.id || null;
            saveData();
            renderCharList();
            renderProfile();
            renderEquipment();
            alert('성공적으로 데이터를 불러왔습니다!');
          }
        } catch (err) {
          alert('올바르지 않은 JSON 파일입니다.');
        }
      };
      reader.readAsText(file);
    }

    // App Init
    window.addEventListener('DOMContentLoaded', () => {
      renderCharList();
      renderProfile();
      renderEquipment();
    });
  </script>
</body>
</html>
